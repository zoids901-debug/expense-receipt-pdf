name = "expense-receipt-vision"
main = "src/index.js"
compatibility_date = "2026-05-11"
preview_urls = false

[observability]
enabled = true
[observability.logs]
enabled = true

# Public origin allowlist (free to override per-deployment via `wrangler secret put`)
[vars]
ALLOWED_ORIGINS = "https://zoids901-debug.github.io"

# 학습 로그 저장용 KV (실패/정답 수집)
[[kv_namespaces]]
binding = "LOGS"
id = "d941765eda294f75a965d72528b388ce"

# 월 OCR 카운터 KV (기존 vision-counter — 반드시 유지)
[[kv_namespaces]]
binding = "COUNTER"
id = "a38191115b624fa2ac3655cd7f4b38bd"

# API key set via:
#   wrangler secret put GOOGLE_VISION_API_KEY
# 로그 덤프 토큰 (아무 긴 문자열). 1회:
#   wrangler secret put LOG_TOKEN
